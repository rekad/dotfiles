# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# window numbering
set -g base-index 1
set -g renumber-windows on # :move-window -r

# mouse
set -g mouse on

# keybinds

# prefix
set -g prefix C-a
unbind C-b

# pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R


## STYLING

# One Dark colors for tmux status bar
set -g status-style bg=#282c34,fg=#abb2bf

# Window list colors
set -g window-status-style bg=#282c34,fg=#5c6370
set -g window-status-current-style bg=#3e4451,fg=#61afef,bold

# Pane borders
set -g pane-border-style fg=#3e4451
set -g pane-active-border-style fg=#61afef

# Message colors
set -g message-style bg=#282c34,fg=#abb2bf

set -g status-position top

# Optional: Inactive/active pane dimming
# set -g window-style fg=#5c6370,bg=#21252b
# set -g window-active-style fg=#abb2bf,bg=#282c34

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
